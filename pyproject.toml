[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmsec"
version = "0.1.0"
description = "Permissioned peer-to-peer CTI exchange with local corroboration scoring"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography==45.0.7",
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.0",
    "click==8.1.7",
    "pydantic==2.10.6",
    "jcs==0.2.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
]

[project.scripts]
swarmsec-node = "swarmsec.cli.main:cli"
swarmsec = "swarmsec.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
